name: Build FocusFB

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL alla tua IPA decrittata di Facebook (lascia vuoto per compilare solo FocusFB.dylib e .deb)"
        required: false
        default: ""
        type: string
      display_name:
        description: "Nome app su iPhone (quando inietti IPA)"
        required: true
        default: "Facebook"
        type: string
      bundle_id:
        description: "Bundle ID (quando inietti IPA)"
        required: true
        default: "com.facebook.Facebook"
        type: string
      remove_extensions:
        description: "Rimuovi App Extensions nell'IPA (consigliato per SideStore)"
        required: true
        default: true
        type: boolean
      publish_public_release:
        description: "Pubblica anche una Release pubblica con FocusFB.dylib e .deb (senza IPA)"
        required: true
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS arm64
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-estrazione e pulizia repo (se caricato FocusFB-Repo-v2.4.zip via web)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          ZIP_CANDIDATE=""
          for f in FocusFB-Repo-v2.4.zip FocusFB-Repo*.zip; do
            if [[ -f "$f" ]]; then
              ZIP_CANDIDATE="$f"
              break
            fi
          done

          if [[ -n "$ZIP_CANDIDATE" ]]; then
            echo "Trovato $ZIP_CANDIDATE: estrazione file puliti e rimozione vecchi zip..."
            CLEAN_TMP="$RUNNER_TEMP/clean_repo_v24"
            rm -rf "$CLEAN_TMP"
            mkdir -p "$CLEAN_TMP"
            unzip -q -o "$ZIP_CANDIDATE" -d "$CLEAN_TMP"

            # Copia tutti i file del progetto nella root (escludendo .github/workflows che non puo' essere toccato da GITHUB_TOKEN)
            rm -rf "$CLEAN_TMP/.github/workflows"
            cp -R "$CLEAN_TMP/." "$GITHUB_WORKSPACE/"

            # Elimina tutti i vecchi file .zip e vecchie guide ridondanti dalla root del repository
            git rm -f --ignore-unmatch *.zip GUIDA_COMPLETA_IT.md >/dev/null 2>&1 || true
            rm -f "$GITHUB_WORKSPACE"/*.zip "$GITHUB_WORKSPACE/GUIDA_COMPLETA_IT.md"
            chmod +x "$GITHUB_WORKSPACE/scripts/"*.sh "$GITHUB_WORKSPACE/scripts/"*.py 2>/dev/null || true

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "FocusFB v2.4: clean open-source repository structure"
              if [[ "${GITHUB_REF}" == refs/heads/* ]]; then
                git push origin "HEAD:${GITHUB_REF_NAME}"
                echo "Repository ripulito e aggiornato automaticamente su GitHub!"
              fi
            fi
          fi

      - name: Install build tools (ldid & dpkg)
        run: |
          set -euo pipefail
          brew install dpkg
          brew install ldid-procursus || brew install ldid
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Compile FocusFB.dylib
        run: |
          set -euo pipefail
          mkdir -p dist
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          xcrun --sdk iphoneos clang++ \
            -isysroot "$SDK_PATH" \
            -target arm64-apple-ios15.0 \
            -dynamiclib \
            -std=gnu++17 \
            -fobjc-arc \
            -fobjc-exceptions \
            -fobjc-call-cxx-cdtors \
            -O2 \
            -Wno-deprecated-declarations \
            -Wno-undeclared-selector \
            -install_name "@rpath/FocusFB.dylib" \
            -Isrc \
            src/Tweak.mm \
            src/FocusFBFishhook.mm \
            src/FocusFBPrefs.mm \
            src/FocusFBSideloadFix.mm \
            src/FocusFBTabManager.mm \
            src/FocusFBSettingsViewController.mm \
            src/FocusFBLockManager.mm \
            src/FocusFBAdBlocker.mm \
            -lobjc \
            -framework Foundation \
            -framework CoreFoundation \
            -framework UIKit \
            -framework QuartzCore \
            -framework CoreGraphics \
            -framework Security \
            -framework AVFoundation \
            -framework CoreImage \
            -weak_framework CoreNFC \
            -o dist/FocusFB.dylib

          ldid -S dist/FocusFB.dylib
          otool -L dist/FocusFB.dylib
          python3 scripts/verify_dylib.py dist/FocusFB.dylib

      - name: Package .deb
        run: |
          set -euo pipefail
          VERSION="$(awk -F': ' '/^Version:/ {print $2}' control | tr -d '[:space:]')"
          PKG_ROOT="$RUNNER_TEMP/deb_stage"
          rm -rf "$PKG_ROOT"
          mkdir -p "$PKG_ROOT/DEBIAN" "$PKG_ROOT/Library/MobileSubstrate/DynamicLibraries"

          cp dist/FocusFB.dylib "$PKG_ROOT/Library/MobileSubstrate/DynamicLibraries/FocusFB.dylib"
          cp FocusFB.plist "$PKG_ROOT/Library/MobileSubstrate/DynamicLibraries/FocusFB.plist"
          cp control "$PKG_ROOT/DEBIAN/control"

          chmod -R 0755 "$PKG_ROOT/DEBIAN"
          chmod 0755 "$PKG_ROOT/Library/MobileSubstrate/DynamicLibraries/FocusFB.dylib"
          chmod 0644 "$PKG_ROOT/Library/MobileSubstrate/DynamicLibraries/FocusFB.plist"

          DEB_OUT="dist/com.focusfb.tweak_${VERSION}_iphoneos-arm64.deb"
          dpkg-deb -Zgzip --root-owner-group -b "$PKG_ROOT" "$DEB_OUT" \
            || dpkg-deb -Zgzip -b "$PKG_ROOT" "$DEB_OUT"

      - name: Inject into personal IPA (workflow_dispatch or vars.IPA_URL)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.ipa_url != '' || vars.IPA_URL != '') }}
        env:
          INPUT_IPA_URL: ${{ inputs.ipa_url || vars.IPA_URL }}
          INPUT_DISPLAY_NAME: ${{ inputs.display_name || 'Facebook' }}
          INPUT_BUNDLE_ID: ${{ inputs.bundle_id || 'com.facebook.Facebook' }}
          INPUT_REMOVE_EXT: ${{ inputs.remove_extensions != false }}
        run: |
          set -euo pipefail
          IPA_IN="$RUNNER_TEMP/facebook_clean.ipa"
          URL_TO_FETCH="$INPUT_IPA_URL"

          if [[ "$URL_TO_FETCH" == *"dropbox.com"* ]]; then
            URL_TO_FETCH="${URL_TO_FETCH/\?dl=0/?dl=1}"
            URL_TO_FETCH="${URL_TO_FETCH/&dl=0/&dl=1}"
          fi

          if [[ "$URL_TO_FETCH" == *"drive.google.com"* ]]; then
            pipx run gdown --fuzzy "$URL_TO_FETCH" -O "$IPA_IN"
          else
            curl --fail --location --retry 3 --retry-delay 2 "$URL_TO_FETCH" -o "$IPA_IN"
          fi

          unzip -tq "$IPA_IN" >/dev/null

          MERGE_PLIST="$RUNNER_TEMP/focusfb_info_merge.plist"
          python3 -c 'import plistlib, sys; plistlib.dump({"NFCReaderUsageDescription": "Scan NFC tag to unlock FocusFB"}, open(sys.argv[1], "wb"))' "$MERGE_PLIST"

          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

          CYAN_ARGS=(
            -i "$IPA_IN"
            -o "dist/FocusFB_Patched.ipa"
            -u -w -q -s --overwrite
            -n "$INPUT_DISPLAY_NAME"
            -b "$INPUT_BUNDLE_ID"
            -l "$MERGE_PLIST"
            -f "dist/FocusFB.dylib"
          )

          if [[ "$INPUT_REMOVE_EXT" == "true" ]]; then
            CYAN_ARGS+=( -e )
          fi

          cyan "${CYAN_ARGS[@]}"
          unzip -tq "dist/FocusFB_Patched.ipa" >/dev/null

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FocusFB-Build
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (dylib + deb only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_public_release == true) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.4.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'FocusFB v2.4.0' }}
          files: |
            dist/FocusFB.dylib
            dist/*.deb
          generate_release_notes: true
